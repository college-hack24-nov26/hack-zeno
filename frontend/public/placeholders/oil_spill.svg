<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_os" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="road_os" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#eab308" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="150" fill="url(#sky_os)" />
  <polygon points="0,450 800,450 560,150 240,150" fill="url(#road_os)" />
  <polygon points="0,450 240,150 190,150 0,450" fill="#334155" opacity="0.8" />
  <polygon points="800,450 560,150 610,150 800,450" fill="#334155" opacity="0.8" />

  <polygon points="397,150 403,150 405,210 395,210" fill="#f8fafc" opacity="0.5" />
  <polygon points="394,240 406,240 409,320 391,320" fill="#f8fafc" opacity="0.6" />
  <polygon points="388,360 412,360 416,450 384,450" fill="#f8fafc" opacity="0.7" />

  <!-- Dense Dark Oil Base -->
  <path d="M 240,360 C 270,320 340,300 450,310 C 560,320 620,350 580,390 C 530,430 380,420 280,410 C 220,400 210,380 240,360 Z" fill="#090d16" opacity="0.9" />
  
  <!-- Iridescent Sheen Layer -->
  <path d="M 260,365 C 290,330 350,315 440,320 C 540,325 590,350 560,385 C 510,415 390,410 300,400 C 240,395 240,380 260,365 Z" fill="url(#sheen)" />

  <!-- Internal swirl streaks -->
  <ellipse cx="410" cy="360" rx="140" ry="35" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7" />
  <ellipse cx="440" cy="370" rx="90" ry="20" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.8" />
  <ellipse cx="380" cy="355" rx="60" ry="15" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.75" />

  <!-- Droplets / splatter trail leading out -->
  <circle cx="210" cy="365" r="8" fill="#090d16" />
  <circle cx="210" cy="365" r="5" fill="#06b6d4" opacity="0.7" />
  <circle cx="180" cy="370" r="5" fill="#090d16" />
  <circle cx="155" cy="378" r="3" fill="#090d16" />
  <circle cx="610" cy="395" r="7" fill="#090d16" />
  <circle cx="635" cy="405" r="4" fill="#090d16" />
</svg>