<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="water" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="ripple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="150" fill="url(#sky)" />
  <rect x="0" y="120" width="800" height="40" fill="#64748b" opacity="0.4" />
  <polygon points="0,450 800,450 560,150 240,150" fill="url(#road)" />
  <polygon points="0,450 240,150 200,150 0,450" fill="#334155" opacity="0.8" />
  <polygon points="800,450 560,150 600,150 800,450" fill="#334155" opacity="0.8" />

  <polygon points="397,150 403,150 405,210 395,210" fill="#f8fafc" opacity="0.6" />
  <polygon points="394,240 406,240 409,320 391,320" fill="#f8fafc" opacity="0.7" />
  <polygon points="388,360 412,360 416,450 384,450" fill="#f8fafc" opacity="0.8" />

  <!-- Submerged Trench / Waterlogging Puddle -->
  <ellipse cx="380" cy="350" rx="240" ry="70" fill="url(#water)" />
  <ellipse cx="440" cy="330" rx="160" ry="50" fill="#38bdf8" opacity="0.5" />
  <ellipse cx="380" cy="350" rx="210" ry="55" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
  <ellipse cx="350" cy="360" rx="130" ry="30" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />
  <ellipse cx="410" cy="340" rx="90" ry="22" fill="none" stroke="#f0f9ff" stroke-width="1" opacity="0.7" />
  <ellipse cx="370" cy="370" rx="50" ry="12" fill="url(#ripple)" />
  <path d="M160,350 Q 220,410 360,415 Q 520,420 610,360 Q 560,310 440,300 Q 260,290 160,350 Z" fill="none" stroke="#0369a1" stroke-width="3" opacity="0.7" />
  <ellipse cx="180" cy="270" rx="15" ry="4" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.5" />
  <ellipse cx="580" cy="290" rx="20" ry="5" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.5" />
</svg>