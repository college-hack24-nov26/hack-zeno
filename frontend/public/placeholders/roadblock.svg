<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_rb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="road_rb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="150" fill="url(#sky_rb)" />
  <polygon points="0,450 800,450 560,150 240,150" fill="url(#road_rb)" />
  <polygon points="0,450 240,150 190,150 0,450" fill="#334155" opacity="0.8" />
  <polygon points="800,450 560,150 610,150 800,450" fill="#334155" opacity="0.8" />

  <!-- Cast Shadows -->
  <ellipse cx="260" cy="380" rx="35" ry="10" fill="#000" opacity="0.5" />
  <ellipse cx="540" cy="380" rx="35" ry="10" fill="#000" opacity="0.5" />
  <ellipse cx="400" cy="380" rx="170" ry="16" fill="#000" opacity="0.4" />

  <!-- Roadblock Stand Legs -->
  <rect x="250" y="270" width="14" height="110" fill="#475569" rx="2" />
  <polygon points="230,380 284,380 265,360 248,360" fill="#334155" />
  <rect x="536" y="270" width="14" height="110" fill="#475569" rx="2" />
  <polygon points="516,380 570,380 551,360 534,360" fill="#334155" />

  <!-- Upper Diagonal Striped Barricade Board -->
  <g transform="translate(210, 250)">
    <rect x="0" y="0" width="380" height="42" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="4" />
    <!-- Diagonal Orange Stripes -->
    <polygon points="10,0 45,0 15,42 0,42" fill="#ea580c" />
    <polygon points="75,0 110,0 75,42 40,42" fill="#ea580c" />
    <polygon points="140,0 175,0 140,42 105,42" fill="#ea580c" />
    <polygon points="205,0 240,0 205,42 170,42" fill="#ea580c" />
    <polygon points="270,0 305,0 270,42 235,42" fill="#ea580c" />
    <polygon points="335,0 370,0 335,42 300,42" fill="#ea580c" />
  </g>

  <!-- Lower Diagonal Striped Barricade Board -->
  <g transform="translate(210, 310)">
    <rect x="0" y="0" width="380" height="38" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="4" />
    <polygon points="10,0 45,0 15,38 0,38" fill="#ea580c" />
    <polygon points="75,0 110,0 75,38 40,38" fill="#ea580c" />
    <polygon points="140,0 175,0 140,38 105,38" fill="#ea580c" />
    <polygon points="205,0 240,0 205,38 170,38" fill="#ea580c" />
    <polygon points="270,0 305,0 270,38 235,38" fill="#ea580c" />
    <polygon points="335,0 370,0 335,38 300,38" fill="#ea580c" />
  </g>

  <!-- Flashing Warning Beacon on Top -->
  <circle cx="257" cy="235" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
  <circle cx="257" cy="235" r="8" fill="#fef08a" />
  <circle cx="543" cy="235" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
  <circle cx="543" cy="235" r="8" fill="#fef08a" />
</svg>