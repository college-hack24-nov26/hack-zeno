<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_ob" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="road_ob" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rockFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="rockSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="150" fill="url(#sky_ob)" />
  <polygon points="0,450 800,450 560,150 240,150" fill="url(#road_ob)" />
  <polygon points="0,450 240,150 190,150 0,450" fill="#334155" opacity="0.8" />
  <polygon points="800,450 560,150 610,150 800,450" fill="#334155" opacity="0.8" />

  <polygon points="397,150 403,150 405,210 395,210" fill="#f8fafc" opacity="0.5" />
  <polygon points="394,240 406,240 409,320 391,320" fill="#f8fafc" opacity="0.6" />
  <polygon points="388,360 412,360 416,450 384,450" fill="#f8fafc" opacity="0.7" />

  <!-- Obstacle Shadow on Road -->
  <ellipse cx="440" cy="375" rx="120" ry="35" fill="#000000" opacity="0.6" />

  <!-- Heavy Concrete Obstacle Block / Rock in Right Lane -->
  <!-- Top Face -->
  <polygon points="410,260 480,245 540,265 470,285" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <!-- Left/Front Face -->
  <polygon points="380,340 410,260 470,285 450,370" fill="url(#rockFront)" stroke="#334155" stroke-width="1.5" />
  <!-- Right Face -->
  <polygon points="470,285 540,265 560,330 450,370" fill="url(#rockSide)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Hazard Stripes on Obstacle Face -->
  <polygon points="400,310 415,270 430,274 415,315" fill="#f59e0b" opacity="0.9" />
  <polygon points="430,320 445,278 460,282 445,325" fill="#f59e0b" opacity="0.9" />

  <!-- Fractured smaller stones around obstacle -->
  <polygon points="330,360 360,350 355,370 325,372" fill="#64748b" stroke="#334155" />
  <polygon points="560,355 585,348 580,362 555,365" fill="#475569" stroke="#1e293b" />
</svg>